name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agro_input
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agro_input
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agro_input -d agro_input"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://agro_input:ci-only-password@127.0.0.1:5432/agro_input
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
